name: Build DSpico Video

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    name: Build with Docker using devkitARM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Libraries (libtwl7 & libtwl9)
        run: |
          make -C libs/libtwl7
          make -C libs/libtwl9

      - name: Build NDS Firmware
        run: |
          make

      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: "*.nds"
          name: dspicovideo-firmware
```[cite: 1]

Сохрани изменения в воркфлоу, сделай коммит и отправь на GitHub — теперь библиотеки соберутся перед компиляцией `arm7`/`arm9`, и ошибка `cannot find -ltwl7` исчезнет[cite: 1]!
