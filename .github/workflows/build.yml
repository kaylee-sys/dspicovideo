name: Build DSpico Video

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    name: Build with Docker using devkitARM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone TinyUSB dependency
        run: |
          mkdir -p libs
          git clone https://github.com/hathach/tinyusb.git libs/tinyusb

      - name: Build NDS Firmware
        run: |
          make

      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: "*.nds"
          name: dspicovideo-firmware
```[cite: 1]

Обнови файл в репозитории на GitHub и запускай проверку — после этого `tusb.h` скачается прямо перед сборкой в нужную папку `libs/tinyusb`, и компилятор успешно доберется до файлов!
